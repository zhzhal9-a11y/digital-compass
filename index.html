<script>
(function () {
  "use strict";

  var root = document.getElementById("root");

  function showError(error) {
    console.error("Ошибка запуска приложения:", error);

    root.innerHTML =
      '<div style="' +
      'min-height:100vh;' +
      'display:flex;' +
      'align-items:center;' +
      'justify-content:center;' +
      'padding:24px;' +
      'box-sizing:border-box;' +
      'background:#eff6ff;' +
      'font-family:Arial,sans-serif;">' +

      '<div style="' +
      'max-width:600px;' +
      'width:100%;' +
      'padding:32px;' +
      'background:white;' +
      'border-radius:24px;' +
      'box-shadow:0 10px 40px rgba(0,0,0,.12);' +
      'text-align:center;">' +

      '<div style="' +
      'font-size:48px;' +
      'margin-bottom:15px;">⚠️</div>' +

      '<h1 style="' +
      'color:#1e3a8a;' +
      'margin-bottom:15px;">' +
      'Не удалось запустить сайт' +
      '</h1>' +

      '<p style="' +
      'font-size:18px;' +
      'line-height:1.6;' +
      'color:#475569;">' +
      'Проверьте подключение к интернету и обновите страницу.' +
      '</p>' +

      '<button onclick="location.reload()" style="' +
      'border:0;' +
      'border-radius:14px;' +
      'padding:14px 24px;' +
      'background:#1d4ed8;' +
      'color:white;' +
      'font-size:17px;' +
      'font-weight:bold;' +
      'cursor:pointer;">' +
      'Обновить страницу' +
      '</button>' +

      '</div></div>';
  }

  function loadScript(urls, check) {
    return new Promise(function (resolve, reject) {
      var index = 0;

      function tryNext() {
        if (index >= urls.length) {
          reject(
            new Error(
              "Не удалось загрузить библиотеку:\n" +
              urls.join("\n")
            )
          );
          return;
        }

        var url = urls[index++];

        console.log("Загрузка:", url);

        var script = document.createElement("script");

        script.src = url;
        script.async = false;

        script.onload = function () {
          try {
            if (!check || check()) {
              console.log("Успешно загружено:", url);
              resolve();
            } else {
              console.warn(
                "Библиотека загрузилась, но нужная переменная не найдена:",
                url
              );

              script.remove();
              tryNext();
            }
          } catch (e) {
            script.remove();
            tryNext();
          }
        };

        script.onerror = function () {
          console.warn("Не удалось загрузить:", url);
          script.remove();
          tryNext();
        };

        document.head.appendChild(script);
      }

      tryNext();
    });
  }

  /*
   * ==========================================================
   * REACT
   * ==========================================================
   */

  loadScript(
    [
      "https://unpkg.com/react@18.3.1/umd/react.production.min.js",
      "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
    ],
    function () {
      return (
        typeof window.React !== "undefined" &&
        typeof window.React.createElement === "function"
      );
    }
  )

  /*
   * ==========================================================
   * REACT DOM
   * ==========================================================
   */

  .then(function () {
    return loadScript(
      [
        "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
        "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
      ],
      function () {
        return (
          typeof window.ReactDOM !== "undefined" &&
          typeof window.ReactDOM.createRoot === "function"
        );
      }
    );
  })

  /*
   * ==========================================================
   * BABEL
   * ==========================================================
   */

  .then(function () {
    return loadScript(
      [
        "https://unpkg.com/@babel/standalone@7.26.10/babel.min.js",
        "https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js"
      ],
      function () {
        return (
          typeof window.Babel !== "undefined" &&
          typeof window.Babel.transform === "function"
        );
      }
    );
  })

  /*
   * ==========================================================
   * LUCIDE
   * ==========================================================
   */

  .then(function () {

    /*
     * lucide-react может обращаться к глобальному
     * имени react, поэтому создаём алиас.
     */

    window.react = window.React;

    return loadScript(
      [
        "https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.js",
        "https://cdn.jsdelivr.net/npm/lucide-react@0.468.0/dist/umd/lucide-react.js"
      ],
      function () {
        return (
          typeof window.LucideReact !== "undefined" &&
          typeof window.LucideReact.Volume2 !== "undefined"
        );
      }
    );
  })

  /*
   * ==========================================================
   * ЗАПУСК REACT
   * ==========================================================
   */

  .then(function () {

    console.log("Все библиотеки успешно загружены.");

    var sourceElement =
      document.getElementById("app-source");

    if (!sourceElement) {
      throw new Error(
        "Элемент #app-source не найден."
      );
    }

    var sourceCode =
      sourceElement.textContent ||
      sourceElement.innerText ||
      "";

    if (!sourceCode.trim()) {
      throw new Error(
        "Код приложения внутри #app-source отсутствует."
      );
    }

    /*
     * Компилируем JSX через Babel.
     */

    var compiled =
      Babel.transform(
        sourceCode,
        {
          presets: [
            [
              "react",
              {
                runtime: "classic"
              }
            ]
          ],

          sourceType: "script",

          filename: "app.jsx"
        }
      ).code;

    if (!compiled) {
      throw new Error(
        "Babel не смог скомпилировать приложение."
      );
    }

    /*
     * Запускаем полученный JavaScript.
     */

    var appScript =
      document.createElement("script");

    appScript.type =
      "text/javascript";

    appScript.text =
      compiled;

    document.body.appendChild(
      appScript
    );

    console.log(
      "✓ Цифровой Компас запущен."
    );
  })

  /*
   * ==========================================================
   * ОБРАБОТКА ОШИБКИ
   * ==========================================================
   */

  .catch(function (error) {
    showError(error);
  });

})();
</script>
