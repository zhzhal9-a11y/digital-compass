<!--
  АРХИТЕКТУРНЫЙ ФИКС ("Babel is not defined"):
  Раньше React/ReactDOM/Babel/Lucide подключались раздельными статическими
  <script src> тегами. Это НЕ гарантирует надёжность: если ЛЮБОЙ из них не
  загрузился (сеть, блокировка провайдером/расширением, таймаут, временная
  проблема самого unpkg на конкретном versioned-пути) — браузер просто тихо
  идёт дальше к следующему тегу, а не останавливается и не сообщает об этом.
  Итог именно так и проявился: "Uncaught ReferenceError: Babel is not
  defined" — тег с Babel по какой-то причине не выполнился, а сама HTML-
  разметка не знала об этом и не могла ничего исправить.
  Ниже — единый загрузчик, который:
    1) грузит библиотеки СТРОГО последовательно (React → ReactDOM → Babel →
       Lucide), и следующий шаг стартует только когда предыдущий
       гарантированно отработал — порядок больше не зависит от скорости
       сети или порядка тегов в разметке;
    2) для КАЖДОЙ библиотеки задано зеркало-фолбэк на jsDelivr: если основной
       источник (unpkg) не ответил или ответил, но не создал ожидаемую
       глобальную переменную — автоматически подставляется второй CDN той
       же самой версии;
    3) если оба CDN всё равно недоступны — вместо тихого белого экрана в
       #root выводится понятное сообщение об ошибке сети, а не пустая
       страница.
  Tailwind Play CDN не входит в эту цепочку — он влияет только на CSS и не
  может привести к белому экрану, поэтому подключается независимо.
-->

/* ---------------------------------------------------------------------- */
/*  Локальная озвучка отдельных блоков (доп. к общей кнопке «Озвучка»)     */
/* ---------------------------------------------------------------------- */
/*
 * SpeechContext хранит id блока, который сейчас озвучивается (или null).
 * Общая кнопка «Озвучка» в AccessibilityBar использует тот же контекст
 * (со специальным id "__global__"), поэтому в любой момент говорит только
 * один голос: запуск озвучки любого блока автоматически останавливает
 * предыдущую — будь то другой блок или вся страница целиком.
 */

const SpeechContext = createContext(null);

/**
 * Пытается выбрать наиболее «живой» и естественный русский голос из тех,
 * что предоставляет браузер. Список голосов у каждого браузера/ОС свой,
 * поэтому мы не завязываемся на конкретное имя, а оцениваем голоса по
 * распространённым признакам более качественного (не роботизированного)
 * звучания, и в любом случае возвращаем хоть какой-то русский голос, если
 * он есть.
 */
function pickBestRussianVoice(voices) {
  if (!voices || !voices.length) return null;

  const russian = voices.filter((v) => (v.lang || "").toLowerCase().startsWith("ru"));
  if (!russian.length) return null;

  // Признаки, которые в разных браузерах/ОС обычно указывают на более
  // естественно звучащий голос (облачные/нейросетевые голоса), а не на
  // базовый системный синтезатор.
  const goodHints = ["google", "natural", "online", "neural", "enhanced", "premium", "wavenet"];
  // Конкретные системные голоса, которые на практике звучат мягче и спокойнее
  // стандартного робота (macOS/iOS — Milena/Yuri, Windows — Irina и т.п.).
  const namedHints = ["milena", "yuri", "irina", "katya", "ekaterina"];

  const score = (v) => {
    const name = (v.name || "").toLowerCase();
    let s = 0;
    goodHints.forEach((hint) => {
      if (name.includes(hint)) s += 3;
    });
    namedHints.forEach((hint) => {
      if (name.includes(hint)) s += 2;
    });
    if (v.lang.toLowerCase() === "ru-ru") s += 1;
    // Голоса, отдаваемые удалённым сервисом браузера, зачастую звучат
    // естественнее локальных офлайн-голосов.
    if (v.localService === false) s += 1;
    return s;
  };

  return russian.slice().sort((a, b) => score(b) - score(a))[0];
}

function SpeechProvider({ children }) {
  const [activeId, setActiveId] = useState(null);
  const pauseTimeoutRef = useRef(null);

  // Некоторые браузеры заполняют список голосов асинхронно — заранее
  // «пробуждаем» его, чтобы к моменту нажатия «Прослушать» голоса уже были
  // доступны.
  useEffect(() => {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.getVoices();
    const onVoicesChanged = () => window.speechSynthesis.getVoices();
    window.speechSynthesis.addEventListener?.("voiceschanged", onVoicesChanged);
    return () => {
      window.speechSynthesis.removeEventListener?.("voiceschanged", onVoicesChanged);
    };
  }, []);

  const clearPauseTimeout = () => {
    if (pauseTimeoutRef.current) {
      clearTimeout(pauseTimeoutRef.current);
      pauseTimeoutRef.current = null;
    }
  };

  const stop = useCallback(() => {
    clearPauseTimeout();
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
    setActiveId(null);
  }, []);

  const speak = useCallback((id, text) => {
    if (!("speechSynthesis" in window)) {
      alert("К сожалению, ваш браузер не поддерживает озвучивание текста.");
      return;
    }
    const clean = (text || "").trim();
    // Остановить предыдущую озвучку, если она идёт, прежде чем начать новую.
    clearPauseTimeout();
    window.speechSynthesis.cancel();
    if (!clean) {
      setActiveId(null);
      return;
    }

    // Заголовок и основной текст разделяются двойным переносом строки
    // (см. хелпер withPause ниже) — это озвучивается как две отдельные
    // фразы с небольшой паузой между ними, что звучит естественнее, чем
    // один сплошной поток речи.
    const segments = clean
      .split(/\n{2,}/)
      .map((s) => s.trim())
      .filter(Boolean);

    const voice = pickBestRussianVoice(window.speechSynthesis.getVoices());

    const speakSegment = (index) => {
      if (index >= segments.length) {
        setActiveId((cur) => (cur === id ? null : cur));
        return;
      }
      const utterance = new SpeechSynthesisUtterance(segments[index]);
      utterance.lang = voice ? voice.lang : "ru-RU";
      if (voice) utterance.voice = voice;
      // Комфортный, спокойный темп и естественная высота голоса — не
      // мультяшный и не механический.
      utterance.rate = 0.95; // в пределах рекомендованных 0.9–1.0
      utterance.pitch = 1.0;
      utterance.volume = 1.0;
      utterance.onend = () => {
        if (index + 1 < segments.length) {
          // Небольшая пауза между заголовком и основным текстом для более
          // естественного звучания.
          pauseTimeoutRef.current = setTimeout(() => speakSegment(index + 1), 350);
        } else {
          setActiveId((cur) => (cur === id ? null : cur));
        }
      };
      utterance.onerror = () => setActiveId((cur) => (cur === id ? null : cur));
      window.speechSynthesis.speak(utterance);
    };

    speakSegment(0);
    setActiveId(id);
  }, []);

  const toggle = useCallback(
    (id, text) => {
      if (activeId === id) {
        stop();
      } else {
        speak(id, text);
      }
    },
    [activeId, speak, stop]
  );

  // На всякий случай останавливаем озвучку, если компонент размонтируется.
  useEffect(() => {
    return () => {
      clearPauseTimeout();
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
    };
  }, []);

  return (
    <SpeechContext.Provider value={{ activeId, speak, stop, toggle }}>
      {children}
    </SpeechContext.Provider>
  );
}

/**
 * Склеивает заголовок и основной текст с явным разделителем-паузой, чтобы
 * речь звучала как «заголовок. [пауза] основной текст», а не сплошным
 * потоком.
 */
function withPause(title, body) {
  const t = (title || "").trim();
  const b = (body || "").trim();
  if (!t) return b;
  if (!b) return t;
  const t2 = /[.!?…]$/.test(t) ? t : `${t}.`;
  return `${t2}\n\n${b}`;
}

function useSpeech() {
  const ctx = useContext(SpeechContext);
  if (!ctx) {
    throw new Error("useSpeech должен использоваться внутри <SpeechProvider>");
  }
  return ctx;
}

/**
 * Небольшая, аккуратная кнопка «Прослушать» для конкретного информационного
 * блока. При нажатии озвучивает только переданный текст (а не всю
 * страницу). Повторное нажатие — или запуск озвучки другого блока —
 * останавливает воспроизведение.
 */
function SpeakButton({ id, text, label = "Прослушать", tone = "light" }) {
  const { activeId, toggle } = useSpeech();
  const isActive = activeId === id;

  // "light" — обычная кнопка на светлом фоне (по умолчанию).
  // "onDark" — вариант для тёмных/цветных плашек (например, синий блок правила).
  const toneClasses =
    tone === "onDark"
      ? isActive
        ? "border-white bg-white text-blue-800 hover:bg-blue-50"
        : "border-white/40 bg-white/10 text-white hover:border-white hover:bg-white/20"
      : isActive
      ? "border-blue-700 bg-blue-700 text-white hover:bg-blue-800"
      : "border-blue-200 bg-white text-blue-700 hover:border-blue-400 hover:bg-blue-50";

  return (
    <button
      type="button"
      onClick={(e) => {
        e.stopPropagation();
        toggle(id, text);
      }}
      aria-label={isActive ? "Остановить озвучку этого блока" : `${label} этот блок`}
      aria-pressed={isActive}
      className={
        "inline-flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-sm font-semibold shadow-sm transition active:scale-95 " +
        toneClasses
      }
    >
      {isActive ? (
        <VolumeX className="h-4 w-4 shrink-0" />
      ) : (
        <Volume2 className="h-4 w-4 shrink-0" />
      )}
      {isActive ? "Остановить" : label}
    </button>
  );
}

          onClick={onScale}
          className="flex items-center gap-1.5 rounded-full bg-white px-3 py-2 text-xs font-bold text-blue-800 shadow-lg transition hover:bg-blue-50 active:scale-95 sm:gap-2 sm:px-4 sm:py-2.5 sm:text-sm"

            (speaking

          }
          aria-label="Прочитать вслух текст на экране"
        >

            <Volume2 className="h-4 w-4 shrink-0 sm:h-[18px] sm:w-[18px]" />
          )}

    <div className="flex flex-wrap items-center gap-3">
      <button
        onClick={onScale}
        className="flex items-center gap-2 rounded-2xl border-2 border-blue-200 bg-white px-4 py-3 text-base font-semibold text-blue-800 shadow-sm transition hover:border-blue-400 hover:bg-blue-50 active:scale-95"

      >
        <ZoomIn className="h-5 w-5" />
        Увеличить текст
        <span className="rounded-full bg-blue-100 px-2 py-0.5 text-sm text-blue-700">
          {scaleLevel + 1}/4
        </span>
      </button>
      <button
        onClick={onSpeak}
        className={
          "flex items-center gap-2 rounded-2xl border-2 px-4 py-3 text-base font-semibold shadow-sm transition active:scale-95 " +
          (speaking
            ? "border-blue-700 bg-blue-700 text-white hover:bg-blue-800"
            : "border-blue-200 bg-white text-blue-800 hover:border-blue-400 hover:bg-blue-50")
        }
        aria-label="Прочитать вслух текст на экране"
      >
        {speaking ? <VolumeX className="h-5 w-5" /> : <Volume2 className="h-5 w-5" />}
        {speaking ? "Остановить" : "Озвучка"}
      </button>
    </div>
  );
}

          className="flex flex-1 items-center justify-end gap-2 rounded-2xl border-2 border-blue-200 bg-white px-5 py-4 text-right text-base font-semibold text-blue-800 shadow-sm hover:bg-blue-50"
        >
          <span className="truncate">{next.title}</span>
          <ChevronRight className="h-5 w-5 shrink-0" />
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Страница: книга «Смартфон с нуля»                                     */
/* ---------------------------------------------------------------------- */

function BookPage({ go, chapter, setChapter }) {
  const total = CHAPTERS.length;
  const ch = CHAPTERS[chapter];
  const Icon = ch.icon;
  const chapterContentRef = useRef(null);

  // Выбор главы: список слева (на desktop) или лента сверху (на мобильном)
  // никогда не пропадает — меняется только содержимое справа/снизу, без
  // перезагрузки страницы. На мобильном дополнительно прокручиваем к началу
  // содержимого главы, чтобы новый текст сразу попал в поле зрения.
  const selectChapter = (i) => {
    setChapter(i);
    if (typeof window !== "undefined" && window.matchMedia("(max-width: 767px)").matches) {
      requestAnimationFrame(() => {
        chapterContentRef.current?.scrollIntoView({ behavior: "smooth", block: "start" });
      });
    }
  };

  return (
    <div className="mx-auto max-w-6xl px-5 py-10 sm:px-8">
      <button
        onClick={() => go("home")}
        className="mb-6 flex items-center gap-2 text-lg font-semibold text-blue-700 hover:text-blue-900"
      >
        <ArrowLeft className="h-5 w-5" />
        На главную
      </button>

      <h1 className="text-3xl font-extrabold text-blue-900 sm:text-4xl">
        Смартфон с нуля
      </h1>

      {/* Прогресс */}
      <div className="mt-5">
        <div className="flex items-center justify-between text-base font-semibold text-blue-800">
          <span>
            Глава {chapter + 1} из {total}
          </span>
          <span>{Math.round(((chapter + 1) / total) * 100)}%</span>
        </div>
        <div className="mt-2 h-3 w-full overflow-hidden rounded-full bg-blue-100">
          <div
            className="h-full rounded-full bg-blue-600 transition-all"
            style={{ width: `${((chapter + 1) / total) * 100}%` }}
          />
        </div>
      </div>

      {/*
        Двухколоночная раскладка на desktop: слева фиксированная колонка
        со списком всех 10 глав (~288px, стандартный класс w-72 — без
        произвольных значений Tailwind, чтобы колонка гарантированно
        рендерилась в любой сборке), справа — оставшееся пространство под
        контент выбранной главы. На мобильном (ниже md) колонки складываются
        в вертикальный поток: сверху горизонтальная лента выбора главы,
        ниже — содержимое.
      */}
      <div className="mt-7 flex flex-col gap-6 md:flex-row md:items-start md:gap-7">
        {/* Мобильная лента выбора главы — всегда видна, ничего не сворачивается */}
        <nav className="md:hidden" aria-label="Выбор главы">
          <div className="-mx-1 flex gap-2 overflow-x-auto px-1 pb-1">
            {CHAPTERS.map((c, i) => {
              const CIcon = c.icon;
              const active = i === chapter;
              return (
                <button
                  key={i}
                  onClick={() => selectChapter(i)}
                  aria-current={active ? "true" : undefined}
                  className={
                    "flex shrink-0 items-center gap-2 whitespace-nowrap rounded-2xl px-3.5 py-2.5 text-sm font-semibold transition " +
                    (active
                      ? "bg-blue-700 text-white shadow-sm"
                      : "border border-blue-100 bg-white text-blue-900")
                  }
                >
                  <span
                    className={
                      "flex h-6 w-6 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                      (active ? "bg-white/20 text-white" : "bg-blue-100 text-blue-700")
                    }
                  >
                    {i + 1}
                  </span>
                  <CIcon className="h-4 w-4 shrink-0" />
                  {c.title}
                </button>
              );
            })}
          </div>
        </nav>

        {/* Desktop-колонка: постоянный список всех 10 глав слева */}
        <nav className="hidden shrink-0 md:block md:w-72" aria-label="Главы книги">
          <ol className="sticky top-24 space-y-1 rounded-3xl border border-blue-100 bg-white p-3 shadow-sm">
            {CHAPTERS.map((c, i) => {
              const CIcon = c.icon;
              const active = i === chapter;
              return (
                <li key={i}>
                  <button
                    onClick={() => selectChapter(i)}
                    aria-current={active ? "true" : undefined}
                    className={
                      "flex w-full items-center gap-3 rounded-2xl px-3 py-2.5 text-left text-base font-semibold transition " +
                      (active
                        ? "bg-blue-700 text-white shadow-sm"
                        : "text-blue-900 hover:bg-blue-50")
                    }
                  >
                    <span
                      className={
                        "flex h-7 w-7 shrink-0 items-center justify-center rounded-full text-xs font-bold " +
                        (active ? "bg-white/20 text-white" : "bg-blue-100 text-blue-700")
                      }
                    >
                      {i + 1}
                    </span>
                    <CIcon className="h-5 w-5 shrink-0" />
                    <span className="leading-snug">{c.title}</span>
                  </button>
                </li>
              );
            })}
          </ol>
        </nav>

        {/* Контент выбранной главы — занимает всё оставшееся пространство */}
        <div ref={chapterContentRef} className="min-w-0 flex-1">
          <div className="rounded-3xl border border-blue-100 bg-white p-7 shadow-sm sm:p-9">
            <div className="flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-4">
                <div className="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-blue-100">
                  <Icon className="h-8 w-8 text-blue-700" />
                </div>
                <h2 className="text-2xl font-bold text-blue-900 sm:text-3xl">
                  Глава {chapter + 1}. {ch.title}
                </h2>
              </div>
              <SpeakButton
                id={`book-chapter-${chapter}`}
                text={withPause(ch.title, ch.paragraphs.join(" "))}
              />
            </div>
            <div className="mt-6 space-y-4">
              {ch.paragraphs.map((p, i) => (
                <p key={i} className="text-lg leading-relaxed text-slate-700">
                  {p}
                </p>
              ))}
            </div>
            {ch.tip && (
              <div className="mt-6 flex flex-wrap items-start justify-between gap-3 rounded-2xl bg-blue-50 p-5">
                <div className="flex flex-1 gap-3">
                  <Info className="mt-1 h-5 w-5 shrink-0 text-blue-700" />
                  <p className="text-base font-medium leading-relaxed text-blue-900">
                    {ch.tip}
                  </p>
                </div>
                <SpeakButton id={`book-tip-${chapter}`} text={withPause("Совет", ch.tip)} />
              </div>
            )}
          </div>

          <div className="mt-6 flex items-center justify-between gap-4">
            <button
              onClick={() => setChapter((c) => Math.max(0, c - 1))}
              disabled={chapter === 0}
              className="flex items-center gap-2 rounded-2xl border-2 border-blue-200 bg-white px-5 py-4 text-lg font-bold text-blue-800 shadow-sm transition hover:bg-blue-50 disabled:cursor-not-allowed disabled:opacity-40"
            >
              <ChevronLeft className="h-5 w-5" />
              Назад
            </button>
            <button
              onClick={() => setChapter((c) => Math.min(total - 1, c + 1))}
              disabled={chapter === total - 1}
              className="flex items-center gap-2 rounded-2xl bg-blue-700 px-5 py-4 text-lg font-bold text-white shadow-sm transition hover:bg-blue-800 disabled:cursor-not-allowed disabled:opacity-40"
            >
              Далее
              <ChevronRight className="h-5 w-5" />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------------------- */
/*  Приложение                                                            */
/* ---------------------------------------------------------------------- */

const SCALE_LEVELS = [1, 1.15, 1.3, 1.45];

function AppInner() {
  const [page, setPage] = useState("home"); // home | dangers | danger | book
  const [dangerId, setDangerId] = useState(DANGERS[0].id);
  const [chapter, setChapter] = useState(0);
  const [scaleLevel, setScaleLevel] = useState(0);
  const [emergencyOpen, setEmergencyOpen] = useState(false);
  const contentRef = useRef(null);

  // Общая (глобальная) озвучка использует тот же SpeechContext, что и
  // локальные кнопки «Прослушать» — под специальным id "__global__". Это
  // гарантирует, что одновременно звучит только что-то одно: включение
  // локальной озвучки блока остановит общую, и наоборот.
  const { activeId, speak, stop } = useSpeech();
  const speaking = activeId === "__global__";

  const go = useCallback(
    (p) => {
      stop();
      setPage(p);
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    [stop]
  );

  const openDanger = useCallback(
    (id) => {
      stop();
      setDangerId(id);
      setPage("danger");
      window.scrollTo({ top: 0, behavior: "smooth" });
    },
    [stop]
  );

  const handleScale = () => setScaleLevel((l) => (l + 1) % SCALE_LEVELS.length);

  const handleSpeak = () => {
    if (speaking) {
      stop();
      return;
    }
    const text = contentRef.current ? contentRef.current.innerText : "";
    speak("__global__", text);
  };

  useEffect(() => {
    stop();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [page, dangerId, chapter]);

  return (
    <div
      className="min-h-screen bg-blue-50/40 font-sans text-slate-800"
      style={{ zoom: SCALE_LEVELS[scaleLevel] }}
    >
      <header className="sticky top-0 z-30 border-b border-blue-100 bg-white/95 backdrop-blur-sm">
        <div className="mx-auto flex max-w-5xl items-center justify-between gap-4 px-5 py-4 sm:px-8">
          <button onClick={() => go("home")} aria-label="На главную">
            <Logo />
          </button>
          <nav className="hidden items-center gap-2 sm:flex">
            <button
              onClick={() => go("dangers")}
              className={
                "rounded-xl px-4 py-2 text-base font-semibold transition " +
                (page === "dangers" || page === "danger"
                  ? "bg-blue-100 text-blue-800"
                  : "text-blue-700 hover:bg-blue-50")
              }
            >
              Опасности
            </button>
            <button
              onClick={() => go("book")}
              className={
                "rounded-xl px-4 py-2 text-base font-semibold transition " +
                (page === "book" ? "bg-blue-100 text-blue-800" : "text-blue-700 hover:bg-blue-50")
              }
            >
              Смартфон с нуля
            </button>
          </nav>
          {page !== "home" && (
            <div className="hidden sm:block">
              <AccessibilityBar
                scaleLevel={scaleLevel}
                onScale={handleScale}
                speaking={speaking}
                onSpeak={handleSpeak}
              />
            </div>
          )}
        </div>
        {page !== "home" && (
          <div className="border-t border-blue-50 px-5 py-3 sm:hidden">
            <AccessibilityBar
              scaleLevel={scaleLevel}
              onScale={handleScale}
              speaking={speaking}
              onSpeak={handleSpeak}
            />
          </div>
        )}
      </header>

      <main ref={contentRef}>
        {page === "home" && (
          <HomePage
            go={go}
            scaleLevel={scaleLevel}
            onScale={handleScale}
            speaking={speaking}
            onSpeak={handleSpeak}
          />
        )}
        {page === "dangers" && <DangersListPage go={go} openDanger={openDanger} />}
        {page === "danger" && (
          <DangerDetailPage id={dangerId} go={go} openDanger={openDanger} />
        )}
        {page === "book" && <BookPage go={go} chapter={chapter} setChapter={setChapter} />}
      </main>

      <footer className="mt-10 border-t border-blue-100 bg-white py-8">
        <div className="mx-auto max-w-5xl px-5 text-center text-base text-slate-500 sm:px-8">
          <p>
            «Цифровой Компас» — учебный сайт о безопасном использовании смартфона и
            интернета. Все советы носят общий информационный характер.
          </p>
        </div>
      </footer>

      {/* Плавающая кнопка экстренной помощи */}
      <button
        onClick={() => setEmergencyOpen(true)}
        className="fixed bottom-5 left-1/2 z-40 flex -translate-x-1/2 items-center gap-2 rounded-full bg-red-600 px-6 py-4 text-lg font-bold text-white shadow-2xl transition hover:bg-red-700 active:scale-95 sm:bottom-6 sm:left-auto sm:right-6 sm:translate-x-0"
      >
        <PhoneCall className="h-6 w-6" />
        Срочно нужна помощь
      </button>

      <EmergencyModal
        open={emergencyOpen}
        onClose={() => {
          stop();
          setEmergencyOpen(false);
        }}
      />
    </div>
  );
}

function App() {
  return (
    <SpeechProvider>
      <AppInner />
    </SpeechProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
<!--
  Единый последовательный загрузчик (см. подробный комментарий в <head>).
  Каждая критичная библиотека грузится с основного источника (unpkg), а при
  сбое — автоматически со второго CDN (jsDelivr) той же версии. Только когда
  ВСЕ они гарантированно загружены и создали свои глобальные переменные,
  выполняется транспиляция JSX из #app-source (с явной опцией
  { runtime: "classic" }, чтобы результат всегда был обычным
  React.createElement(...), независимо от версии Babel) и запуск
  приложения. Если сеть/CDN всё же недоступны — вместо белого экрана
  показывается понятное сообщение в #root.
-->
<script>
(function () {
  function loadScript(urls, isReady) {
    return new Promise(function (resolve, reject) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) {
          reject(new Error('Не удалось загрузить ни с одного источника: ' + urls.join(', ')));
          return;
        }
        var url = urls[i++];
        var el = document.createElement('script');
        el.src = url;
        el.onload = function () {
          if (!isReady || isReady()) resolve();
          else tryNext();
        };
        el.onerror = function () { tryNext(); };
        document.head.appendChild(el);
      }
      tryNext();
    });
  }

  loadScript(
    [
      'https://unpkg.com/react@18/umd/react.production.min.js',
      'https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js',
    ],
    function () { return typeof window.React !== 'undefined'; }
  )
    .then(function () {
      return loadScript(
        [
          'https://unpkg.com/react-dom@18/umd/react-dom.production.min.js',
          'https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js',
        ],
        function () { return typeof window.ReactDOM !== 'undefined'; }
      );
    })
    .then(function () {
      // Версия закреплена (7.29.8): без версии unpkg отдаёт "latest", а это
      // сейчас Babel 8.x, у которого @babel/preset-react по умолчанию
      // использует JSX-runtime "automatic" (вставляет
      // `import ... from "react/jsx-runtime"`, что ломается в обычном
      // скрипте). Мы всё равно передаём { runtime: 'classic' } явно ниже —
      // двойная защита от повторного дрейфа версии CDN.
      return loadScript(
        [
          'https://unpkg.com/@babel/standalone@7.29.8/babel.min.js',
          'https://cdn.jsdelivr.net/npm/@babel/standalone@7.29.8/babel.min.js',
        ],
        function () { return typeof window.Babel !== 'undefined'; }
      );
    })
    .then(function () {
      // UMD-сборка lucide-react ищет React через глобальную переменную
      // нижнего регистра `react`, а не `React` — создаём алиас до её загрузки.
      window.react = window.React;
      return loadScript(
        [
          'https://unpkg.com/lucide-react@0.379.0/dist/umd/lucide-react.js',
          'https://cdn.jsdelivr.net/npm/lucide-react@0.379.0/dist/umd/lucide-react.js',
        ],
        function () { return typeof window.LucideReact !== 'undefined'; }
      );
    })
    .then(function () {
      var sourceCode = document.getElementById('app-source').textContent;
      var compiled = Babel.transform(sourceCode, {
        presets: [['react', { runtime: 'classic' }]],
        filename: 'app.jsx',
      }).code;
      var runnable = document.createElement('script');
      runnable.text = compiled;
      document.body.appendChild(runnable);
    })
    .catch(function (err) {
      console.error('Не удалось запустить приложение:', err);
      document.getElementById('root').innerHTML =
        '<div style="max-width:640px;margin:80px auto;padding:24px;' +
        'font-family:sans-serif;text-align:center;color:#7f1d1d;' +
        'background:#fee2e2;border-radius:16px;">' +
        '<b>Не удалось загрузить необходимые библиотеки с CDN.</b><br/>' +
        'Проверьте подключение к интернету и обновите страницу. ' +
        'Подробности — в консоли браузера (F12).</div>';
    });
})();
</script>
</body>
</html>
